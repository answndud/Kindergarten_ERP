services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    container_name: kindergarten-erp-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9091"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp-network

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: kindergarten-erp-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - erp-network

  caddy:
    image: caddy:2@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    container_name: kindergarten-erp-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - erp-network

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  erp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
